<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">长期思考与个人系统电子书封面</title>
  <desc id="desc">A refined green and warm paper e-book cover for Long-Term Thinking and Personal Systems.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#eadfcb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f5e4d"/>
      <stop offset="1" stop-color="#113b32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#16211c" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="#163c34"/>
  <rect x="74" y="70" width="752" height="1060" rx="28" fill="url(#paper)" filter="url(#shadow)"/>
  <path d="M74 70h752v320c-116-48-205-42-314 4-151 63-278 34-438-42z" fill="url(#green)" opacity=".96"/>
  <circle cx="703" cy="235" r="76" fill="#c17b55" opacity=".95"/>
  <circle cx="703" cy="235" r="32" fill="#fffaf0" opacity=".85"/>
  <text x="126" y="170" fill="#fffaf0" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="8">YITEN HUANG</text>
  <text x="126" y="505" fill="#17221d" font-family="'Noto Serif SC', serif" font-size="74" font-weight="700">长期思考</text>
  <text x="126" y="598" fill="#17221d" font-family="'Noto Serif SC', serif" font-size="74" font-weight="700">与个人系统</text>
  <rect x="126" y="650" width="118" height="6" rx="3" fill="#c17b55"/>
  <text x="126" y="733" fill="#58645d" font-family="'Noto Serif SC', serif" font-size="34" font-weight="500">给独立创作者的内容资产、</text>
  <text x="126" y="782" fill="#58645d" font-family="'Noto Serif SC', serif" font-size="34" font-weight="500">订阅关系与个人操作系统。</text>
  <g transform="translate(126 870)">
    <rect width="280" height="74" rx="37" fill="#eef5ef"/>
    <text x="34" y="48" fill="#1f5e4d" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">PDF / EPUB / MOBI</text>
  </g>
  <text x="126" y="1038" fill="#17221d" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Book + Audio Notes + Companion Pack</text>
